<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        input:checked {
            accent-color: red;
        }

        input:focus {
            background-color: lightgreen;
        }

        input:enabled {
            border: 2px solid blue;
        }

        input:disabled {
            background-color: lightgray;
            color: gray;
        }
    </style>
</head>
<body>
    <h1>회원가입</h1>
    <p>
        이름: 
        <input type="text" placeholder="이름을 입력하세요">
    </p>
    <p>
        학번:
        <input type="text" value="22528488" disabled>
    </p>
    <div>
        <input type="checkbox" name="" id="">
        개인정보 수집에 동의합니다.
    </div>
</body>
</html>
